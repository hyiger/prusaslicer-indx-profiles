toolchange_gcode = {if not (layer_num < 0 )}\n  {\n  local speed_tc = min(travel_speed, 350.0) * 60;\n  local deretract_length = 1.0 * retract_toolchange + retract_length[next_extruder];\n  local target_temp = temperature[next_extruder];\n  local eject_temp = max(160,target_temp - 60);\n  local filament_area = 3.14 * filament_diameter[next_extruder] * filament_diameter[next_extruder] / 4.0;\n  local purge_mm = max(3.0, filament_minimal_purge_on_wipe_tower[next_extruder] * 1.0 / filament_area);\n  local purge_speed_fast = 60.0 * min(6,max(1.5,0.6*filament_max_volumetric_speed[next_extruder]/filament_area));\n  local purge_speed_slow = 60.0 * min(3,max(1.5,0.3*filament_max_volumetric_speed[next_extruder]/filament_area));\n  local tc_retract_speed = 60.0 * min(30,max(10,retract_speed[current_extruder]));\n  local tc_deretract_speed = 60.0 * min(20,max(5,deretract_speed[next_extruder]));\n  }\n\n  {if filament_minimal_purge_on_wipe_tower[next_extruder] == 0}\n    {purge_mm = 5.0}\n  {endif}\n\n  {if filament_flush_volume[next_extruder] > 0}\n    {purge_mm = max(3.0, filament_flush_volume[next_extruder] / filament_area)}\n  {endif}\n\n  {if filament_flush_speed[next_extruder] > 0}\n    {purge_speed_fast = 60.0 * min(10,max(1,filament_flush_speed[next_extruder]))}\n    {purge_speed_slow = 60.0 * min(10,max(1,filament_flush_speed[next_extruder] / 2))}\n  {endif}\n\n  {if filament_type[current_extruder]=="FLEX"}\n    {tc_retract_speed = 60*15}\n  {endif}\n\n  {if filament_type[next_extruder]=="FLEX"}\n    {tc_deretract_speed = 60*10}\n  {endif}\n\n  {if !is_nil(filament_retract_length_toolchange[next_extruder])}\n    {deretract_length = retract_toolchange + filament_retract_length_toolchange[next_extruder]}\n  {endif}\n\n  {if tool_init[next_extruder] == 0}\n    {deretract_length = 1.6}\n  {endif}\n\n  {if layer_z <= (first_layer_height + 0.0001)}\n    {target_temp = first_layer_temperature[next_extruder]}\n  {endif}\n\n  ; Change Tool[previous_extruder] -> Tool[next_extruder] (layer [layer_num])\n  M83\n\n  {if retract_length_toolchange[current_extruder] == 0}\n    G1 E-{retract_length[current_extruder]} F{retract_speed[current_extruder] * 60}\n  {endif}\n\n  G1 F{speed_tc}\n  M204 S7000\n  ;EXCLUDE_E_START\n  G27 W3 Z{travel_max_lift[current_extruder]} P2 R{retract_toolchange} V{tc_retract_speed/60} A{travel_slope[current_extruder]}\n  ;EXCLUDE_E_END\n  P0 S1 L0 D0\n\n\n  T{next_extruder} S1 L0 D0\n\n  M104 S{eject_temp+15}\n\n  G12 S90 ; enter cleaner\n\n  G0 Z{layer_z + 0.8} ; Lift\n\n  M109 C{eject_temp} ; Skip residency\n\n  M104 S{target_temp + 5}\n\n  {if ((wipe_tower == false) or (tool_init[next_extruder] == 0))}\n  ;-------Purge Station specific Gcode Start-----\n\n    {if tool_init[next_extruder] == 1}\n      ;EXCLUDE_E_START\n      G1 E1.6 F{20 * 60} ; Final lock tool\n      ;EXCLUDE_E_END\n    {endif}\n\n    G12 S30 ; eject poop\n\n    M106 S{255 / 100 * max_fan_speed[next_extruder]}\n\n    M906 P1 ; Set extruder current\n\n    M109 C{target_temp}\n    M104 S{target_temp}\n\n    {if tool_init[next_extruder] == 1}\n      ;EXCLUDE_E_START\n      G1 E{retract_toolchange} F{tc_deretract_speed} ; Restore filament retracted by G27 R on park\n      ;EXCLUDE_E_END\n      G1 E{deretract_length - retract_toolchange} F{tc_deretract_speed}\n    {else}\n      G1 E{deretract_length} F{tc_deretract_speed}\n    {endif}\n\n    G91 ; use relative coordinates\n    M83 ; extruder relative mode\n    M572 S0.0 ; Disable PressureAdvance\n\n    ;FLUSH_START\n    G1 X-0.2  E{0}                F{1200}\n    G1 X0.40  E{0.15 * purge_mm}  F{0.40 / (0.15 * purge_mm) * purge_speed_slow}\n    G1 Y-1.20 E{0.35 * purge_mm}  F{1.20 / (0.35 * purge_mm) * purge_speed_fast}\n    G1 X-0.4  E{0.20 * purge_mm}  F{0.40 / (0.20 * purge_mm) * purge_speed_fast}\n    G1 Y1.20  E{0.25 * purge_mm}  F{1.20 / (0.25 * purge_mm) * purge_speed_fast}\n    G1 X0.20  E{0.05 * purge_mm}  F{0.20 / (0.05 * purge_mm) * purge_speed_fast}\n    ;FLUSH_END\n\n    M400\n    M906 P0 ; Revert extruder current\n\n    ; RETRACT AFTER TOOLCHANGE START\n    G1 Y0 E-{retract_length[next_extruder]} F{retract_speed[next_extruder] * 60}\n\n    {e_retracted[next_extruder] = retract_length[next_extruder] + retract_restart_extra_toolchange[next_extruder]}\n    ; RETRACT AFTER TOOLCHANGE END\n\n    G1 Y5 F{speed_tc}\n\n  ;-------Purge Station specific Gcode End-----\n\n\n\n\n  {else}\n  ;-------Wipe Tower specific Gcode Start-----\n\n    ;EXCLUDE_E_START\n    G1 E2.0 F{retract_speed[current_extruder] * 60}\n    ;EXCLUDE_E_END\n\n    G750 Y85 F21000 A\n    G750 Y93 F21000 A\n    G750 Y82 F21000 A\n    G750 Y98.5 F21000 A\n    G750 Y75 F21000 A\n    G750 Y98.5 F21000 A\n\n    M109 C{target_temp}\n    M104 S{target_temp}\n\n    ;EXCLUDE_E_START\n    G1 E{retract_toolchange-2.0} F{tc_deretract_speed} ; Restore filament retracted by G27 R on park\n    ;EXCLUDE_E_END\n    G1 E{deretract_length-retract_toolchange-retract_length[next_extruder]+1.2} F{tc_deretract_speed}\n    {e_retracted[next_extruder] = retract_length[next_extruder]}\n    G1 F{speed_tc} ;revert travel speed\n\n  ;-------Wipe Tower specific Gcode End-----\n  {endif}\n\n  {tool_init[next_extruder] = 1}\n\n  G90 ; use absolute coordinates\n  M83 ; extruder relative mode\n  G12 S91 ; Exit cleaning station\n  G0 Z{layer_z + 1.0} ; Lift\n  G4 S0\n{else}\n  T{next_extruder} S1 L0 D0\n{endif}
