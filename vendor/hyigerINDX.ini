# Print profiles for the Prusa CORE One INDX (8T / 4T), by hyiger.
# Generated by tools/build_print_profiles.py from PrusaResearch.ini
# config_version 2.5.12. Geometry comes from Prusa per-nozzle commons;
# standard-nozzle (STD) profiles are Prusa's HF ones of the same size,
# rebound to a non-high-flow nozzle; a mixed tool layout is Prusa's own
# profiles for the tool that prints perimeters, with each role pinned to
# a tool and the moved ones taking that tool's width and rate.
#
# Install: copy this file and the .idx into <datadir>/vendor/
# templates_profile = 1 lets these attach to the Prusa-vendor INDX
# printer while still loading as read-only system presets.

[vendor]
repo_id = non-prusa-fff
name = hyiger INDX
config_version = 0.7.2
templates_profile = 1

# ---- 0.6 mm : resolved copy of Prusa *INDX_06hf_common*
#
# Changed from Prusa's common (COMMON_EDITS, then per tier Nozzle.extra):
#   bridge_speed: 50 -> 30
#       inherited 50 is ~14 mm3/s at a 0.6 bridge
#   interlocking_beam_width: unset -> 1.2
#       introduced, not overridden: the chain leaves it unset and
#       PrusaSlicer defaults it to 0.8, too narrow past 0.4. Set to 2x
#       nozzle. Inert unless interlocking beams are enabled, and not applied
#       on the --std path
#   print_settings_id: unset -> (empty)
#       system preset hygiene
#   compatible_printers: unset -> (empty)
#       condition-based binding only
#   0.20mm Detail @COREONEINDX HF0.6: top_solid_layers: 4 -> 5
#       matches Prusa 0.20mm BALANCED @COREONE HF0.6
#   0.20mm Detail @COREONEINDX HF0.6: bottom_solid_layers: 3 -> 4
#       matches Prusa 0.20mm BALANCED @COREONE HF0.6
#   0.32mm Draft @COREONEINDX HF0.6: min_bead_width: 85% -> 90%
#       Prusa's own Draft tier uses 90% (0.25mm Draft @COREONEINDX HF0.4); a
#       deliberate transfer of that tier choice, not the 85% every @COREONE
#       HF0.6 profile carries
# Speeds: the six main speeds of each tier are solved from the nozzles.py
# flow targets, in mm3/s: perimeter 26, external perimeter 20, small
# perimeter 18, infill 30, solid infill 27, top solid infill 11.3.

[print:*COREONEINDX HF0.6*]
arc_fitting = emit_center
automatic_infill_combination_max_layer_height = 100%
bottom_fill_pattern = monotonic
bottom_solid_layers = 3
bottom_solid_min_thickness = 0.6
bridge_acceleration = 1500
bridge_angle = 0
bridge_flow_ratio = 1
bridge_speed = 30
brim_separation = 0.1
brim_type = outer_only
brim_width = 0
compatible_printers = 
compatible_printers_condition = printer_model=~/(COREONE_INDX8T|COREONE_INDX4T)/ and nozzle_diameter[0]==0.6
