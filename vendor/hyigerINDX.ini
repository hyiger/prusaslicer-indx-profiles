# ---- 1.0 mm : SCALED from Prusa *INDX_08hf_common* (0.8 mm). Prusa publishes nothing
#      at 1.0 mm: line widths and layers x1.25, everything else held at 0.8 mm
#      apart from the per-size COMMON_EDITS listed below.
# UNVALIDATED: SCALED from 0.8: Prusa publishes nothing at 1.0. Line widths and layers x1.25; flow targets and everything but the per-size COMMON_EDITS held at 0.8's, which are themselves extrapolated
#
# Changed from Prusa's common (COMMON_EDITS, then the 1.0/0.8 scaling and size labels, then per tier Nozzle.extra):
#   bridge_speed: 50 -> 30
#       inherited 50 is ~14 mm3/s at a 0.6 bridge
#   interlocking_beam_width: unset -> 2
