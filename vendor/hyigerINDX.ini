# ---- 0.25+HF0.4 : MIXED tool layout on an INDX 8T
#      tool 1 0.25, tools 2-8 HF0.4
#      Prusa's own "@COREONEINDX 0.25" print profiles, renamed and rebound:
#      tool 1's 0.25 nozzle prints the perimeters, so its profiles carry
#      the layer ladder and the surface geometry. Prusa's own INDX 0.25
#      prints, on the one INDX common with a real speed pass. 0.25 has no
#      high-flow variant upstream, so these are a standard 0.25 nozzle's
#      profiles
#      Roles:  infill tool 2 (HF0.4); perimeter tool 1 (0.25); solid_infill tool 1 (0.25); support_material tool 1 (0.25); support_material_interface tool 1 (0.25)
#
# Changed from Prusa's own profiles (COMMON_EDITS, the role pinning, the
# layout's own decisions, then the moved roles). A change named with a
# profile applies to that tier only:
#   print_settings_id: unset -> (empty)
#       system preset hygiene
#   compatible_printers: unset -> (empty)
#       condition-based binding only
#   infill_extruder: 1 -> 2
#       tool 2 carries the HF0.4 nozzle and prints this role, so the widths
#       and speeds it owns come from Prusa's own profile for that nozzle
#   support_material_extruder: 0 -> 1
#       pinned to tool 1 (0.25). Prusa leaves this role at 0, "whichever
#       tool is loaded", which names no nozzle. Pinning it is what silences
#       _SUPPORT_NOZZLE_DIAMETER_DIFFER, whose condition tests only the two
#       support extruder keys (Print.cpp:675-679); it does not change the
#       support width, because at 0 the support flow already falls back to
#       the smallest fitted nozzle (Flow.cpp:245-252)
#   support_material_interface_extruder: 0 -> 1
#       pinned to tool 1 (0.25). Prusa leaves this role at 0, "whichever
#       tool is loaded", which names no nozzle. Pinning it is what silences
#       _SUPPORT_NOZZLE_DIAMETER_DIFFER, whose condition tests only the two
#       support extruder keys (Print.cpp:675-679); it does not change the
#       support width, because at 0 the support flow already falls back to
#       the smallest fitted nozzle (Flow.cpp:245-252)
#   support_material_style: snug -> organic
#       recommended, and a hard requirement only with a wipe tower. The rule
#       that would force it - a pinned support extruder with non-soluble
#       supports is rejected unless the style is organic (gate
#       Print.cpp:681, rejection Print.cpp:688-690) - and the dialog that
#       enforces it (ConfigManipulation.cpp:178-180) are both reached only
#       when Print::has_wipe_tower() is true (Print.cpp:1396-1402); every
#       INDX print profile inherits wipe_tower = 0 from Prusa's
#       *INDX_common*, so the INDX purges at its Purge Station and neither
#       is reachable as shipped. Organic is chosen because PrusaSlicer
#       itself prescribes this exact pair for mixed nozzles - "switch to
#       Organic supports and assign a specific extruder for supports"
#       (Plater.cpp:2335-2348) - because Prusa article 821176 recommends it,
#       because it keeps the slice legal if a user switches a tower on, and
#       because the layout was test printed with it. It costs one
#       restriction: an object with a varying layer-height profile cannot be
#       sliced with organic supports (Print.cpp:548-554). Pinning the
#       support extruders is a separate decision and does NOT change the
#       support width - at 0 the support flow already falls back to the
#       smallest fitted nozzle (Flow.cpp:245-252), the same 0.25 - but it is
#       what silences _SUPPORT_NOZZLE_DIAMETER_DIFFER, whose condition tests
#       only those two keys (Print.cpp:675-679)
#   0.07mm Detail @COREONEINDX 0.25+HF0.4: infill_every_layers: 1 -> 3
#       up to 0.25 mm of combined sparse infill at this layer height. That
#       is the smaller of the infill and solid-infill nozzles, which is all
#       PrusaSlicer itself will combine (PrintObject.cpp:3128-3132), bounded
#       also by 0.75 x the infill nozzle - this repo's own ceiling, taken
#       from the default PrusaSlicer uses for an unset max_layer_height
#       (Slicing.cpp:48), which does not bind here. Combining also cuts the
#       tool changes a split role costs from one pair per layer to one pair
#       per 3
#   0.10mm Balanced ★ @COREONEINDX 0.25+HF0.4: infill_every_layers: 1 -> 2
#       up to 0.25 mm of combined sparse infill at this layer height. That
#       is the smaller of the infill and solid-infill nozzles, which is all
#       PrusaSlicer itself will combine (PrintObject.cpp:3128-3132), bounded
#       also by 0.75 x the infill nozzle - this repo's own ceiling, taken
#       from the default PrusaSlicer uses for an unset max_layer_height
#       (Slicing.cpp:48), which does not bind here. Combining also cuts the
#       tool changes a split role costs from one pair per layer to one pair
#       per 2
#   infill_extrusion_width: 0.27 -> 0.45
#       tool 2's own width: Prusa's 0.20mm Balanced ★ @COREONEINDX HF0.4.
#       Prusa's own starred INDX HF0.4 profile, and the same anchor the flow
#       targets above are measured against: 20.4 mm3/s perimeter, 24.4
#       infill
#   0.07mm Detail @COREONEINDX 0.25+HF0.4: infill_speed: 100 -> 285
#       tool 2 (HF0.4) prints this role: solved to the 24.4 mm3/s Prusa's
#       0.20mm Balanced ★ @COREONEINDX HF0.4 runs it at, over 0.45 mm wide
#       and 0.21 mm tall, and never past that profile's own 300 mm/s.
#       Prusa's own starred INDX HF0.4 profile, and the same anchor the flow
#       targets above are measured against: 20.4 mm3/s perimeter, 24.4
#       infill
#   0.10mm Balanced ★ @COREONEINDX 0.25+HF0.4: infill_speed: 100 -> 300
#       tool 2 (HF0.4) prints this role: solved to the 24.4 mm3/s Prusa's
#       0.20mm Balanced ★ @COREONEINDX HF0.4 runs it at, over 0.45 mm wide
#       and 0.2 mm tall, and never past that profile's own 300 mm/s. Prusa's
#       own starred INDX HF0.4 profile, and the same anchor the flow targets
#       above are measured against: 20.4 mm3/s perimeter, 24.4 infill
#   0.15mm Draft @COREONEINDX 0.25+HF0.4: infill_speed: 100 -> 300
#       tool 2 (HF0.4) prints this role: solved to the 24.4 mm3/s Prusa's
#       0.20mm Balanced ★ @COREONEINDX HF0.4 runs it at, over 0.45 mm wide
#       and 0.15 mm tall, and never past that profile's own 300 mm/s.
#       Prusa's own starred INDX HF0.4 profile, and the same anchor the flow
#       targets above are measured against: 20.4 mm3/s perimeter, 24.4
#       infill
#   output_filename_format: {input_filename_base}_0.25n_{layer_height}mm_{printing_filament_types}_COREONEINDX_{print_time}.gcode -> {input_filename_base}_0.25+HF0.4n_{layer_height}mm_{printing_filament_types}_COREONEINDX_{print_time}.gcode
#       layout label, moved from the base tool's 0.25 to 0.25+HF0.4: names
#       the nozzle size in the G-code file
#   compatible_printers_condition: printer_model=~/(COREONE_INDX8T|COREONE_INDX4T)/ and nozzle_diameter[0]==0.25 -> printer_model=~/(COREONE_INDX8T|COREONE_INDX4T)/ and nozzle_diameter[0]==0.25 and ! nozzle_high_flow[0] and nozzle_diameter[1]==0.4 and nozzle_high_flow[1]
#       binds on each tool this layout prints with, by index, and on nothing
#       else: a tool it never uses says nothing about the layout. Print
#       presets are matched against the printer as written
#       (Preset.cpp:1352-1368), and an index past the end of a vector reads
#       element 0 rather than throwing (PlaceholderParser.cpp:1074), so a
#       clause on tool 2 is safe to evaluate on any printer
#   0.07mm Detail @COREONEINDX 0.25+HF0.4: profile name: 0.07mm Extra Fine @COREONEINDX 0.25 -> 0.07mm Detail @COREONEINDX 0.25+HF0.4
#       renamed to this repo's own tier labels: a mixed printer also
#       satisfies Prusa's own @COREONEINDX 0.25 condition, so sharing an
#       alias with Prusa's profiles would hide these behind them
#       (Preset.cpp:1388-1401)
#   0.10mm Balanced ★ @COREONEINDX 0.25+HF0.4: profile name: 0.10mm Fine ★ @COREONEINDX 0.25 -> 0.10mm Balanced ★ @COREONEINDX 0.25+HF0.4
#       renamed to this repo's own tier labels: a mixed printer also
#       satisfies Prusa's own @COREONEINDX 0.25 condition, so sharing an
#       alias with Prusa's profiles would hide these behind them
#       (Preset.cpp:1388-1401)
#   0.15mm Draft @COREONEINDX 0.25+HF0.4: profile name: 0.15mm Detail @COREONEINDX 0.25 -> 0.15mm Draft @COREONEINDX 0.25+HF0.4
#       renamed to this repo's own tier labels: a mixed printer also
#       satisfies Prusa's own @COREONEINDX 0.25 condition, so sharing an
#       alias with Prusa's profiles would hide these behind them
#       (Preset.cpp:1388-1401)
#
# Held at the base tool's value, although the moved role owns them and Prusa's
# profile for that tool differs (ROLE_HELD):
#   infill_acceleration: 3000 (0.20mm Balanced ★ @COREONEINDX HF0.4 has 7000)
#       held at the base tool's 3000 where Prusa gives the HF0.4 nozzle
#       7000, because acceleration is the one gantry both tools share and
#       because the layout was test printed this way. The consequence is
#       real and is documented rather than hidden: reaching the solved
#       infill speed from rest takes about 15 mm at 3000 mm/s2, so short
#       infill moves never get there and the solved rate is a ceiling, not
#       an average. Raising it would need a new test print
#   infill_anchor: 1 (0.20mm Balanced ★ @COREONEINDX HF0.4 has 2)
#       the anchor is the length of infill laid along the perimeter it
#       attaches to, and that perimeter is the base tool's, so the base
#       tool's figure is the right one. Prusa has 1 mm at 0.25 and 2 mm at
#       HF0.4
#
# Moved roles, tier by tier. Each speed is solved so the rate matches the one
# Prusa's own profile for that tool runs the role at, and is never faster than
# that profile's own speed:
#   0.07mm Detail @COREONEINDX 0.25+HF0.4      infill_speed = 285 mm/s on tool 2 (HF0.4)
#       24.2 mm3/s against Prusa's 24.4
#       over 3 x 0.07 mm, since infill_every_layers = 3
#   0.10mm Balanced ★ @COREONEINDX 0.25+HF0.4  infill_speed = 300 mm/s on tool 2 (HF0.4)
#       24.4 mm3/s against Prusa's 24.4, capped at that profile's own 300 mm/s
#       over 2 x 0.1 mm, since infill_every_layers = 2
#   0.15mm Draft @COREONEINDX 0.25+HF0.4       infill_speed = 300 mm/s on tool 2 (HF0.4)
#       18.8 mm3/s against Prusa's 24.4, capped at that profile's own 300 mm/s
#       over 1 x 0.15 mm, since infill_every_layers = 1

